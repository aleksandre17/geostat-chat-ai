# CI / docker stack on geostat-chat-ai-net (used with ops/ci/integration-stack.sh)
# Infra must be up first (postgres, qdrant, rabbitmq on shared network).
services:
  geostat-chat-ai-api:
    environment:
      RETRIEVAL_ENABLED: "true"
      RETRIEVAL_BASE_URL: http://geostat-chat-ai-retrieval:8092
  geostat-chat-ai-ingestion:
    environment:
      SPRING_PROFILES_ACTIVE: dev,docker
      INGESTION_EVENTS_ENABLED: "true"
      QDRANT_URL: http://qdrant:6333
      RABBITMQ_HOST: rabbitmq
      POSTGRES_PASSWORD: ${GEOSTAT_CI_INFRA_PASSWORD:-geostat-dev-change-me}
      RABBITMQ_PASSWORD: ${GEOSTAT_CI_INFRA_PASSWORD:-geostat-dev-change-me}
  geostat-chat-ai-retrieval:
    environment:
      QDRANT_URL: http://qdrant:6333
