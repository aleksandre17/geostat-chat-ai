# Hand-maintained domain config — not touched by geostat config-gen (P0-kit-10)
# Env contract: ops/config/.env.example
geostat:
  retrieval:
    default-collection: ${RETRIEVAL_DEFAULT_CORPUS:geostat-portal}
    hybrid:
      enabled: false  # Set true to enable RRF fusion of dense + sparse retrieval
    qdrant:
      url: ${QDRANT_URL:http://127.0.0.1:6333}
      grpc-port: ${QDRANT_GRPC_PORT:6334}
      use-tls: false
      api-key: ${QDRANT_API_KEY:}
    embedding:
      provider: ${EMBEDDING_PROVIDER:hash-v1}
      model-id: ${EMBEDDING_MODEL_ID:hash-v1}
      vector-size: ${EMBEDDING_VECTOR_SIZE:768}  # must match the embedding model's output dimensions
      gemini-api-key: ${GEMINI_API_KEY:}
      gemini-model: ${GEMINI_EMBED_MODEL:gemini-embedding-001}
      ollama-base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      ollama-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
    search:
      vector-over-fetch: 3
      locale-filter: true
    keyword:
      enabled: ${RETRIEVAL_KEYWORD_ENABLED:true}
    jdbc:
      url: ${RETRIEVAL_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/geostat}
      username: ${RETRIEVAL_JDBC_USER:geostat}
      password: ${RETRIEVAL_JDBC_PASSWORD:geostat}
      max-pool-size: 2
    cache:
      enabled: ${RETRIEVAL_CACHE_ENABLED:true}
      backend: ${RETRIEVAL_CACHE_BACKEND:local}
      ttl-minutes: ${RETRIEVAL_CACHE_TTL_MINUTES:10}
      max-entries: ${RETRIEVAL_CACHE_MAX_ENTRIES:512}
    rerank:
      semantic-cross-encoder: ${RETRIEVAL_SEMANTIC_RERANK:true}
