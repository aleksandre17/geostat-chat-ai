spring:
  datasource:
    url: ${CHAT_TELEMETRY_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/geostat?currentSchema=chat}
    username: ${CHAT_TELEMETRY_JDBC_USER:geostat}
    password: ${CHAT_TELEMETRY_JDBC_PASSWORD:geostat}
  flyway:
    enabled: true
    schemas: chat
    default-schema: chat

geostat:
  telemetry:
    store: jdbc
