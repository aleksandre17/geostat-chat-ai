spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ingestion
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: ingestion
    default-schema: ingestion
    create-schemas: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:${INFRA_HOST:127.0.0.1}}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:geostat}
    password: ${RABBITMQ_PASSWORD:}

management:
  health:
    db:
      enabled: true
    rabbit:
      enabled: ${INGESTION_EVENTS_ENABLED:false}

geostat:
  ingestion:
    indexing:
      enabled: ${INGESTION_INDEXING_ENABLED:true}
      index-version: v1
    events:
      enabled: ${INGESTION_EVENTS_ENABLED:false}
      exchange: geostat.ingestion
      index-queue: geostat.ingestion.document-index
      routing-key: document.index
    qdrant:
      url: ${QDRANT_URL:http://127.0.0.1:6333}
      grpc-port: ${QDRANT_GRPC_PORT:6334}
      use-tls: false
      api-key: ${QDRANT_API_KEY:}
    embedding:
      provider: ${EMBEDDING_PROVIDER:hash-v1}
      model-id: ${EMBEDDING_MODEL_ID:hash-v1}
      vector-size: ${EMBEDDING_VECTOR_SIZE:384}
      gemini-api-key: ${GEMINI_API_KEY:}
      gemini-model: ${GEMINI_EMBED_MODEL:text-embedding-004}
      ollama-base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      ollama-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
