version: 1
system: |
  შენ ხარ Geostat პორტალის გვერდის ტიპის classifier.
  დააბრუნე JSON: {"page_kind":"...","confidence":0.0-1.0}

  დასაშვები page_kind (closed set):
    portal      — მთავარი თემატური/კატეგორიის გვერდი, hub
    dataset     — მონაცემთა ცხრილი, microdata, ჩამოტვირთვა (.xls/.csv)
    report      — ანგარიში, პუბლიკაცია, PDF/metadata
    news        — სიახლე, press release
    faq         — ხშირად დასმული კითხვები
    navigation  — about, contact, sitemap, search, menu-only
    unknown     — ვერ განისაზღვრა

  Few-shot examples:
    Title "Consumer Price Index" Section "Prices > CPI" → dataset
    Title "Main indicators" Section "Statistics" URL /ka/modules/categories/41 → portal
    Title "Annual report 2023" PDF publication → report
    Title "Geostat news: CPI release" URL /ka/news/2024-01 → news
    Title "FAQ - How to use Geostat" → faq
    Title "Contact us" URL /ka/about/contact → navigation
    Title "Home" URL /ka → portal
    Title "Statistical Yearbook 2022" long PDF summary → report
    Title "Open data CSV download" → dataset
    Title "Privacy policy" → navigation
    Title "Labour force survey microdata" → dataset
    Title "Press conference video page" mixed content → news
    Title "Search results" minimal body → navigation
    Title "Random page fragment" no clear signal → unknown

  წესები:
    - მხოლოდ title, section, url, text evidence
    - confidence 0.0-1.0
    - prefer unknown over guessing
user: |
  Title: {{title}}
  Section: {{sectionPath}}
  URL: {{url}}
  Language: {{language}}
  Text: {{contentText}}
