# GENERATED from secrets — run: tools/geostat nginx-gen (or fe deploy dist/local)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:5173 http://localhost:5174 http://localhost:5177 http://127.0.0.1:5177;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
