name: CI



on:

  push:

    branches: [main, master, develop]

  pull_request:

    branches: [main, master, develop]



jobs:

  compose-catalog:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Seed CI env for deterministic compose-gen
        run: bash kits/geostat-kit/ci/prepare-integration-env.sh

      - name: Regenerate compose files

        run: python3 kits/geostat-kit/compose/build.py

      - name: Fail if generated files drift
        run: |
          python3 <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          files = list(json.loads(Path("ops/compose/catalog.json").read_text())["targets"].keys())
          r = subprocess.run(["git", "diff", "--exit-code", "--", *files], capture_output=True, text=True)
          if r.returncode != 0:
              print(r.stdout or r.stderr)
              print("Run geostat compose-gen and commit catalog targets")
              sys.exit(1)
          PY



  ops-package-tests:

    runs-on: ubuntu-latest

    env:
      GEOSTAT_PROJECT_ROOT: ${{ github.workspace }}
      GEOSTAT_KIT_ROOT: ${{ github.workspace }}/kits/geostat-kit
      PYTHONPATH: ${{ github.workspace }}/kits/geostat-kit

    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install pytest

        run: pip install pytest

      - name: Seed CI env for manifest tests
        run: bash kits/geostat-kit/ci/prepare-integration-env.sh

      - name: Generate compose stack for layout tests
        run: python3 kits/geostat-kit/compose/build.py

      - name: Validate manifest
        run: python3 kits/geostat-kit/lib/validate_manifest.py

      - name: geostat-kit package tests (paths, registry, contracts)
        run: python3 -m pytest kits/geostat-kit/tests --tb=short -q



  ops-scripts:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Python syntax

        run: |

          python3 -m py_compile kits/geostat-kit/compose/build.py

          python3 -m py_compile kits/geostat-kit/compose/sync_ops_modules.py

          python3 -m py_compile kits/geostat-kit/toolkit/bash/gen_server_compose.py

          python3 -m py_compile kits/geostat-kit/adapters/render_nginx.py

          python3 -m py_compile ops/ci/run-eval.py

      - name: RAG-U12 eval metric tests
        run: python3 ops/ci/test_run_eval_metrics.py

      - name: Shell syntax (bash)

        run: |

          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

          shellcheck -S error -x ops/ci/*.sh

          find kits/geostat-kit/drivers/java-boot/sh kits/geostat-kit/toolkit/bash kits/geostat-kit/toolkit/deploy kits/geostat-kit/toolkit/infra kits/geostat-kit/toolkit/stack kits/geostat-kit/ci -name '*.sh' -exec bash -n {} +

      - name: Validate compose catalog JSON

        run: python3 -c "import json; json.load(open('ops/compose/catalog.json'))"



  frontend-build:

    runs-on: ubuntu-latest

    defaults:

      run:

        working-directory: apps/frontend

    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4

        with:

          node-version: "20"

          cache: npm

          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      - run: npm run build

        env:

          CI: "true"

          VITE_API_URL: "http://localhost:8080"



  backend-build:

    runs-on: ubuntu-latest

    defaults:

      run:

        working-directory: apps/backend

    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: "21"

      - run: chmod +x gradlew && ./gradlew build -x test



  java-tests:

    runs-on: ubuntu-latest

    continue-on-error: false

    strategy:

      fail-fast: false

      matrix:

        include:

          - module: apps/backend

            gradlew: apps/backend/gradlew

            projectDir: apps/backend

          - module: apps/ingestion-service

            gradlew: apps/ingestion-service/gradlew

            projectDir: apps/ingestion-service

          - module: apps/retrieval-service

            gradlew: apps/retrieval-service/gradlew

            projectDir: apps/retrieval-service

          - module: libs/platform-contracts

            gradlew: apps/backend/gradlew

            projectDir: libs/platform-contracts

          - module: libs/embedding-adapters

            gradlew: apps/backend/gradlew

            projectDir: libs/embedding-adapters

          - module: libs/qdrant-client

            gradlew: apps/backend/gradlew

            projectDir: libs/qdrant-client

    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: "21"

      - name: Run tests (${{ matrix.module }})

        run: chmod +x "${{ matrix.gradlew }}" && "${{ matrix.gradlew }}" -p "${{ matrix.projectDir }}" test

      - name: Upload test reports (${{ matrix.module }})

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: test-reports-${{ matrix.module }}

          path: |

            ${{ matrix.projectDir }}/build/reports/tests/

            ${{ matrix.projectDir }}/build/test-results/

          if-no-files-found: warn



  integration-compose:

    runs-on: ubuntu-latest

    needs: [compose-catalog]

    timeout-minutes: 45

    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Integration stack (infra + manifest health matrix)

        run: bash ops/ci/integration-stack.sh


