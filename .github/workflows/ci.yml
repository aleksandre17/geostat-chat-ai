name: CI



on:

  push:

    branches: [main, master, develop]

  pull_request:

    branches: [main, master, develop]



jobs:

  compose-catalog:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Seed CI env for deterministic compose-gen
        run: bash kits/geostat-kit/ci/prepare-integration-env.sh

      - name: Regenerate compose files

        run: python3 kits/geostat-kit/compose/build.py

      - name: Fail if generated files drift

        run: git diff --exit-code -- '**/docker-compose*.yml' || (echo "Run geostat compose-gen and commit" && exit 1)



  ops-package-tests:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install pytest

        run: pip install pytest

      - name: geostat-kit package tests (paths, registry, contracts)

        run: bash kits/geostat-kit/tests/run-kit-tests.sh



  ops-scripts:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Python syntax

        run: |

          python3 -m py_compile kits/geostat-kit/compose/build.py

          python3 -m py_compile kits/geostat-kit/compose/sync_ops_modules.py

          python3 -m py_compile kits/geostat-kit/toolkit/bash/gen_server_compose.py

          python3 -m py_compile kits/geostat-kit/adapters/render_nginx.py

      - name: Shell syntax (bash)

        run: |

          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

          shellcheck -x kits/geostat-kit/drivers/java-boot/sh/*.sh kits/geostat-kit/toolkit/bash/*.sh kits/geostat-kit/toolkit/deploy/*.sh kits/geostat-kit/toolkit/infra/*.sh kits/geostat-kit/toolkit/stack/*.sh kits/geostat-kit/ci/*.sh ops/ci/*.sh

      - name: Validate compose catalog JSON

        run: python3 -c "import json; json.load(open('ops/compose/catalog.json'))"



  frontend-build:

    runs-on: ubuntu-latest

    defaults:

      run:

        working-directory: apps/frontend

    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4

        with:

          node-version: "20"

          cache: npm

          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      - run: npm run build

        env:

          CI: "true"

          VITE_API_URL: "http://localhost:8080"



  backend-build:

    runs-on: ubuntu-latest

    defaults:

      run:

        working-directory: apps/backend

    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: "21"

      - run: chmod +x gradlew && ./gradlew build -x test



  integration-compose:

    # Stack health needs postgres/qdrant; CI profile not wired yet (hybrid tunnel locally).
    if: false

    runs-on: ubuntu-latest

    needs: [compose-catalog]

    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Prepare CI secrets

        run: bash kits/geostat-kit/ci/prepare-integration-env.sh

      - name: Integration stack (manifest health matrix)

        run: bash ops/ci/integration-stack.sh


